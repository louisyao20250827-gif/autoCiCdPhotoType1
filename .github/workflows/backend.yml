name: "8 · FastAPI → Render"

on:
  push:
    branches: [main]
    paths:
      - "backend/fastapi/**"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/fastapi/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/fastapi/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        run: |
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Wait for new version to be healthy
        if: vars.BACKEND_PUBLIC_URL != ''
        run: |
          # Render sets RENDER_GIT_COMMIT; /health echoes it, so we wait for *this* commit, not the old one
          for i in $(seq 1 40); do
            live=$(curl -fsS "${{ vars.BACKEND_PUBLIC_URL }}/health" | jq -r '.commit // empty' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "commit $live is live"; exit 0; fi
            echo "live=${live:-none}, waiting..."; sleep 15
          done
          echo "::error::commit $GITHUB_SHA not live after 10 minutes"; exit 1

      - name: Log to DEPLOY_LOGS
        if: always()
        run: |
          status="${{ job.status }}"
          # deploy hook only *triggers* the build; without a health URL we can't confirm it
          if [ "$status" = "success" ] && [ -z "${{ vars.BACKEND_PUBLIC_URL }}" ]; then status="triggered"; fi
          bash .github/scripts/log-deploy.sh 8 "$status" "render deploy hook" "${{ vars.BACKEND_PUBLIC_URL }}"
