# Vercel deploys web apps 1/2/3 itself through its GitHub integration.
# Vercel reports each deploy back as a GitHub deployment_status; we copy it into DEPLOY_LOGS.
name: "1-3 · Vercel deploy → DEPLOY_LOGS"

on:
  deployment_status:

jobs:
  log:
    if: contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Map Vercel project → APP_ID and log
        env:
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          STATE: ${{ github.event.deployment_status.state }}
          TARGET_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # (for deployment_status events GITHUB_SHA is already the deployed commit)
        run: |
          # Vercel environment names look like "Production – <vercel-project-name>".
          # Name the Vercel projects so they contain these codes.
          case "$ENVIRONMENT" in
            *web-webview*) app=2 ;;
            *web-angular*) app=3 ;;
            *web-react*)   app=1 ;;
            *) echo "unknown Vercel environment '$ENVIRONMENT', skipping"; exit 0 ;;
          esac
          [ "$STATE" = "success" ] && status=success || status=failure
          bash .github/scripts/log-deploy.sh "$app" "$status" "vercel: $ENVIRONMENT" "$TARGET_URL"
